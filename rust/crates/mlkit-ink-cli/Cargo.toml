[package]
name = "mlkit-ink-cli"
description = "Command line driver for mlkit-ink: fetch packs, recognize ink, fit strokes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mlkit-ink"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
memmap2 = "0.9.11"
mlkit-ink = { workspace = true, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
ureq = "3.4.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

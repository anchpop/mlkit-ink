[package]
name = "mlkit-ink-ffi"
description = "C ABI for mlkit-ink, for Android (JNI) and iOS (Swift) callers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
mlkit-ink = { workspace = true, features = ["std"] }
self_cell = "1.3.0"
serde_json = "1"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/anchpop/mlkit-ink"

[workspace.dependencies]
mlkit-ink = { path = "crates/mlkit-ink", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"

# wasm cares about size; the FST and net dominate, but codegen still matters.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

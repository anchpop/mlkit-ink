plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.inkoracle'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.inkoracle'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'
}

// Keep transitive SDK artifacts stable across future oracle builds.
dependencyLocking {
    lockAllConfigurations()
}
